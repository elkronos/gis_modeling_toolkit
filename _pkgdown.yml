url: https://elkronos.github.io/gis_modeling_toolkit/

template:
  bootstrap: 5

# Figures in the reference examples and the articles. pkgdown's default is a
# 7.3-inch-wide figure shown in a 700-pixel column, which leaves axis and
# strip text small on screen; 6 inches at the same column width reads a
# quarter larger, and matches the width the vignettes use when the package
# itself builds them. A chunk's own fig.height still wins in an article.
figures:
  fig.width: 6
  fig.asp: 0.7

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/getting-started.html

# Articles, in the order to read them. The fifth vignette is the end-to-end
# run and the sixth, on reporting, covers what leaves the session; the three
# between "Getting started" and the end-to-end run each take one topic.
articles:
- title: Get started
  navbar: ~
  contents:
  - getting-started
- title: One topic at a time
  navbar: One topic at a time
  contents:
  - resolution
  - spatial-cross-validation
  - diagnostics
- title: End to end
  navbar: End to end
  contents:
  - spatialkit_nc_demo
  - reporting

# The reference index follows the pipeline in ?spatialkit: resolution,
# tessellate, assign, aggregate, fold, fit, validate, predict, check
# applicability. Every documented topic must appear here or the site build
# stops, which is the point: a new export has to be filed somewhere.
reference:
- title: Overview
  contents:
  - spatialkit-package

- title: Prepare the data
  desc: Coordinate reference systems, geometry coercion, and the clip target.
  contents:
  - ensure_projected
  - harmonize_crs
  - coerce_to_points
  - clip_target_for
  - prep_model_data

- title: Measure the spatial structure
  desc: >
    The distance over which observations stay correlated. It sizes both the
    cells and the cross-validation blocks.
  contents:
  - estimate_sac_range
  - sac_nugget
  - print.sac_range
  - plot.sac_range

- title: Choose a resolution
  desc: How many cells, and how sure that number is.
  contents:
  - determine_optimal_levels
  - resolution_profile
  - select_resolution
  - summary.resolution_profile
  - print.resolution_profile
  - plot.resolution_profile

- title: Tessellate
  desc: Build the regions, with reproducible cell identifiers.
  contents:
  - build_tessellation
  - get_voronoi_seeds
  - voronoi_seeds_kmeans
  - voronoi_seeds_random
  - create_voronoi_polygons
  - create_grid_polygons
  - create_grid_polygons_cached
  - ensure_stable_poly_id
  - plot_tessellation_map

- title: Assign and aggregate
  desc: >
    One row per cell, with a count and a standard error for every aggregate,
    the record of which rows were dropped or tied on the way, and whether a
    block-kriging estimate would have beaten the plain cell mean.
  contents:
  - assign_features_to_polygons
  - summarize_by_cell
  - kriging_adequacy
  - "[.spatialkit_rows"

- title: Fold
  desc: >
    Spatial cross-validation folds, how large the blocks should be, and how
    far the held-out points ended up from the training data.
  contents:
  - make_folds
  - plot_folds
  - fold_separation
  - cv_block_size_sweep
  - plot.block_size_sweep

- title: Fit
  desc: >
    Three backends behind one `spatial_fit` class, and the constructor for
    a backend of your own.
  contents:
  - new_spatial_fit
  - fit_rf_model
  - fit_gwr_model
  - fit_bayesian_spatial_model
  - gp_lengthscale_bounds

- title: Choose the predictors
  desc: >
    Forward selection scored on spatial folds for any backend, and an AICc
    search over predictor sets for GWR.
  contents:
  - select_features_forward
  - plot.feature_selection
  - gwr_model_selection
  - print.gwr_model_selection
  - plot.gwr_model_selection

- title: Methods on a fit
  contents:
  - print.spatial_fit
  - summary.spatial_fit
  - plot.spatial_fit
  - predict.rf_fit
  - predict.gwr_fit
  - predict.bayesian_fit
  - fitted.rf_fit
  - fitted.gwr_fit
  - fitted.bayesian_fit
  - residuals.rf_fit
  - residuals.gwr_fit
  - residuals.bayesian_fit
  - coef.rf_fit
  - coef.gwr_fit
  - coef.bayesian_fit
  - print.rf_fit

- title: Read a fit in sample
  desc: >
    Metrics on the training data (out-of-bag for a forest), and the residual
    checks that say whether structure was left behind. In-sample numbers are
    not comparable across backends; `compare_models_cv()` is.
  contents:
  - model_metrics
  - evaluate_insample
  - compare_models
  - residual_morans_i
  - print.morans_i

- title: Validate
  desc: Score on held-out blocks, and compare backends on the same folds.
  contents:
  - cv_spatial
  - cv_rf
  - cv_gwr
  - cv_bayes
  - compare_models_cv
  - plot_cv_metrics
  - plot_calibration

- title: Predict, and check where the prediction applies
  contents:
  - predict_surface
  - area_of_applicability
  - print.aoa
  - plot.aoa

- title: Package options and caches
  desc: >
    The console log, and the two in-session caches.  Both caches are keyed on
    the inputs, so they only need clearing when memory is the constraint.
  contents:
  - spatialkit_quiet
  - clear_grid_cache
  - clear_fitted_cache
