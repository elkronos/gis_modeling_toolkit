# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Builds the pkgdown site and pushes it to the gh-pages branch, from which
# GitHub Pages serves https://elkronos.github.io/gis_modeling_toolkit/.
# Pull requests build the site (so a broken _pkgdown.yml or vignette fails
# the check) but do not deploy it, and neither does a manual run from any
# branch but main.
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 15
        with:
          use-public-rspm: true

      # Hard dependencies plus the optional packages the articles and the
      # reference examples gate their code on: ggplot2, gstat, sp, geometry,
      # ranger and patchwork.  Seven of the nine articles gate chunks on them
      # (Get started, Choosing a resolution, Building cells, Spatial
      # cross-validation, Fitting and checking models, Exporting and
      # reporting, and the North Carolina example); Troubleshooting and the
      # glossary run on the hard dependencies alone.  Every gate is
      # requireNamespace()-guarded, so a missing package does not fail the
      # build: the page silently shows that code with no output, which is
      # worse.  GWmodel is installed so that the reference pages' mentions of
      # its functions, such as GWmodel::gwr.basic(), link to its help.  FNN,
      # Matrix and tibble are also installed: the package uses them when
      # present and the `backends` job of R-CMD-check.yaml has them, so the
      # articles are built in the environment the vignettes are checked in.
      # brms is left out, as it is there: no article evaluates a Bayesian
      # fit (the chunks that show one are eval = FALSE), and the Stan
      # toolchain is not worth installing to build a website.
      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 40
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgdown
            local::.
            any::ggplot2
            any::sp
            any::GWmodel
            any::gstat
            any::FNN
            any::Matrix
            any::geometry
            any::ranger
            any::tibble
            any::patchwork

      # The gate flags in the vignettes are silent, so check here rather than
      # discovering an empty article on the live site.
      - name: Confirm the vignette dependencies are installed
        run: |
          for (p in c("ggplot2", "sp", "GWmodel", "gstat", "geometry", "ranger",
                      "patchwork")) {
            if (!requireNamespace(p, quietly = TRUE))
              stop("Vignette dependency not installed: ", p)
          }
          cat("All vignette dependencies present.\n")
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # Publish from main, and from a published release as the r-lib template
      # does.  A pull request builds the site without publishing it, and so
      # does a manual run started from any other branch: without the ref test
      # a workflow_dispatch on an unmerged branch would replace the live site.
      # The job-level `contents: write` above exists for this step.  Pull
      # requests from forks get a read-only token whatever it says, and the
      # deploy action is pinned to a commit rather than a tag.
      - name: Deploy to GitHub pages 🚀
        if: github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
