# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Builds the pkgdown site and pushes it to the gh-pages branch, from which
# GitHub Pages serves https://elkronos.github.io/gis_modeling_toolkit/.
# Pull requests build the site (so a broken _pkgdown.yml or vignette fails
# the check) but do not deploy it.
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Hard dependencies plus the optional packages the five vignettes gate
      # their chunks on: ggplot2, gstat, sp and GWmodel, geometry, ranger and
      # patchwork.  Every gate is requireNamespace()-guarded, so a missing
      # package does not fail the build -- it silently renders that article
      # as code with no output, which is worse.  FNN, Matrix and tibble are
      # also installed: the package uses them when present and the `backends`
      # job of R-CMD-check.yaml has them, so the articles are built in the
      # environment the vignettes are checked in.  brms is deliberately
      # absent, as it is there: no vignette evaluates a Bayesian fit (the one
      # chunk that shows one is eval = FALSE), and the Stan toolchain is not
      # worth installing to build a website.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgdown
            local::.
            any::ggplot2
            any::sp
            any::GWmodel
            any::gstat
            any::FNN
            any::Matrix
            any::geometry
            any::ranger
            any::tibble
            any::patchwork

      # The gate flags in the vignettes are silent, so check here rather than
      # discovering an empty article on the live site.
      - name: Confirm the vignette dependencies are installed
        run: |
          for (p in c("ggplot2", "sp", "GWmodel", "gstat", "geometry", "ranger",
                      "patchwork")) {
            if (!requireNamespace(p, quietly = TRUE))
              stop("Vignette dependency not installed: ", p)
          }
          cat("All vignette dependencies present.\n")
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
