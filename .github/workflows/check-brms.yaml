# Weekly check with the brms / Stan backend installed.
#
# brms pulls in a Stan toolchain, which takes many minutes to install -- too
# slow for every push.  This job runs it on a schedule, and can be triggered by
# hand before a CRAN submission.
#
# WHAT THIS ACTUALLY VALIDATES:
#
#   * that brms and its Stan toolchain install and load at all, which is the
#     single most common way this optional backend breaks for users;
#   * that R CMD check passes with brms PRESENT, which is a different code path
#     from the matrix jobs: every requireNamespace("brms") guard flips, so
#     .model_available("Bayesian") becomes TRUE and compare_models_cv() takes
#     its Bayesian branch rather than dropping it;
#   * the five Stan smoke tests in tests/testthat/test-bayes-smoke.R, which
#     SPATIALKIT_TEST_BRMS (set below, and nowhere else) switches on: a ~40-row
#     model is fitted end to end and its predictions, cache, CV wrapper and
#     control merging are checked.  They sample through rstan.  cmdstanr is
#     installed here only because it is in Suggests and the dependency graph
#     must solve; CmdStan itself is NOT built on the runner, and
#     fit_bayesian_spatial_model(backend = "auto") checks for a usable build
#     before choosing cmdstanr.  (It used to choose it on the package's
#     presence alone, and every scheduled run from the day the smoke tests
#     landed failed inside the sampler with "CmdStan path has not been set
#     yet".)  To exercise the cmdstanr path as well, add a step that runs
#     cmdstanr::install_cmdstan() before the check; it takes several minutes.
#
# The "Error:" annotations GitHub attaches to lines such as "mtry can not be
# larger than number of variables in data" are ranger's own stderr output
# from a test that deliberately drives it into that error; they are not
# check failures.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

name: check-brms

permissions: read-all

jobs:
  check-brms:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, with brms)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Every Suggests use in this package is requireNamespace()-guarded,
      # so an optional backend that will not install on one platform should
      # skip its tests, not fail the run.
      _R_CHECK_FORCE_SUGGESTS_: false
      SPATIALKIT_TEST_BRMS: true

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          # Load-bearing: cmdstanr is in Suggests and is NOT on CRAN. R CMD
          # check honours DESCRIPTION's Additional_repositories, but pak --
          # which setup-r-dependencies uses to resolve Suggests -- does not,
          # so without this the dependency graph fails to solve with
          # "Can't find package called cmdstanr" before any R code runs.
          extra-repositories: 'https://stan-dev.r-universe.dev'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # StanHeaders and loo are pinned to CRAN on purpose.  The
          # stan-dev repository above (needed for cmdstanr) also serves
          # development builds of both, and pak prefers the higher version --
          # which leaves CRAN's rstan compiling against headers that no longer
          # define boost::ecuyer1988.
          extra-packages: |
            any::rcmdcheck
            any::brms
            cran::StanHeaders
            cran::loo
            any::sp
            any::GWmodel
            any::gstat
            any::FNN
            any::Matrix
          needs: check

      - name: Confirm brms is installed
        run: |
          if (!requireNamespace("brms", quietly = TRUE))
            stop("brms not installed; this workflow has no purpose without it.")
          cat("brms ", as.character(utils::packageVersion("brms")), "\n")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
